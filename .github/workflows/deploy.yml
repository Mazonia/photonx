name: Deploy PhotonX to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy presentation and docs into dist
        run: |
          cp presentation.html frontend/dist/presentation.html 2>/dev/null || true
          cp PhotonX_Official_Presentation.pptx frontend/dist/PhotonX_Official_Presentation.pptx 2>/dev/null || true
          cp SLIDES_SPEAKER_SCRIPT_LAYMAN.md frontend/dist/SLIDES_SPEAKER_SCRIPT_LAYMAN.md 2>/dev/null || true
          mkdir -p frontend/dist/docs
          cp -r docs/screenshots frontend/dist/docs/ 2>/dev/null || true
          touch frontend/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
